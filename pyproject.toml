[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posteriorforge"
version = "0.1.0"
description = "Reproducible frozen-transformer posterior inference and engineering evidence"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
authors = [{name = "Brieuc Benvegnen"}]
dependencies = ["numpy>=1.26.4,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
inference = ["torch==2.6.0", "tabpfn==2.0.9", "sbi==0.23.0", "numpy==1.26.4", "scipy==1.12.0"]
reference = ["jax[cuda12]==0.8.3", "numpy==2.2.6", "scipy==1.15.3"]
dev = ["pytest>=8,<9", "matplotlib>=3.9,<4", "build"]

[project.scripts]
posteriorforge = "posteriorforge.cli:main"

[project.urls]
Repository = "https://github.com/BrieucB/PosteriorForge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"posteriorforge.science" = ["LICENSE"]
"posteriorforge.upstream" = ["**/LICENSE*", "**/*.json", "**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
